<title>Aalsi Billi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
/* Layout: one calm screen. Big lowercase name, a bunny leaning out of the Instagram button, and five glass buttons in thumb reach.
   Everything is visible at once; the only motion is a 0.5s settle and the reactions to touch. */
:root {
  --night: #07070E;
  --ink: #F4EFEA;
  --ink-dim: rgba(244, 239, 234, 0.68);
  --ink-faint: rgba(244, 239, 234, 0.44);
  --rose: #FF8FB1;
  --gold: #FFD9A3;
  --iris: #8FA8FF;
  --fur: #FFF6F1;
  --display: "Syne", "Archivo Black", system-ui, sans-serif;
  --text: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1rem;
  line-height: 1.4;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

/* ---------- ambient background: gradients only, so it costs almost nothing ---------- */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: var(--night); }
.bg i { position: absolute; display: block; border-radius: 50%; will-change: transform; }
.bg .a {
  width: 95vmax; height: 95vmax; left: -48vmax; top: -52vmax;
  background: radial-gradient(closest-side, rgba(88, 70, 230, 0.55), rgba(88, 70, 230, 0));
  animation: drift-a 26s ease-in-out infinite alternate;
}
.bg .b {
  width: 85vmax; height: 85vmax; right: -48vmax; top: 18vh;
  background: radial-gradient(closest-side, rgba(214, 60, 120, 0.36), rgba(214, 60, 120, 0));
  animation: drift-b 30s ease-in-out infinite alternate;
}
.bg .c {
  width: 75vmax; height: 75vmax; left: -30vmax; bottom: -48vmax;
  background: radial-gradient(closest-side, rgba(255, 170, 110, 0.2), rgba(255, 170, 110, 0));
  animation: drift-c 34s ease-in-out infinite alternate;
}
.bg .stars {
  inset: 0; width: auto; height: auto; border-radius: 0;
  background-image:
    radial-gradient(1px 1px at 22px 34px, rgba(255,255,255,.95), transparent),
    radial-gradient(1px 1px at 96px 120px, rgba(255,255,255,.8), transparent),
    radial-gradient(1.4px 1.4px at 170px 52px, rgba(255,235,210,.9), transparent),
    radial-gradient(1px 1px at 230px 190px, rgba(210,225,255,.85), transparent),
    radial-gradient(1px 1px at 60px 230px, rgba(255,255,255,.7), transparent),
    radial-gradient(1.2px 1.2px at 140px 270px, rgba(255,255,255,.85), transparent),
    radial-gradient(1px 1px at 280px 110px, rgba(255,235,210,.8), transparent);
  background-size: 310px 310px;
  opacity: 0.5;
  animation: twinkle 7s ease-in-out infinite alternate;
}
@keyframes drift-a { to { transform: translate3d(9vmax, 7vmax, 0); } }
@keyframes drift-b { to { transform: translate3d(-8vmax, -9vmax, 0); } }
@keyframes drift-c { to { transform: translate3d(10vmax, -6vmax, 0); } }
@keyframes twinkle { to { opacity: 0.22; } }

/* ---------- page ---------- */
.page {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 100dvh;
  max-width: 520px;
  margin-inline: auto;
  padding-inline: 18px;
  padding-block: 28px 30px;
}

.name {
  margin: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(3.4rem, min(22vw, 11.5dvh), 6.2rem);
  line-height: 0.9;
  letter-spacing: -0.045em;
  animation: rise 0.7s cubic-bezier(0.16, 0.84, 0.24, 1) both;
}
.tagline {
  margin: 14px 0 0;
  max-width: 28ch;
  color: var(--ink-dim);
  font-weight: 500;
  font-size: 1.0625rem;
  animation: rise 0.7s cubic-bezier(0.16, 0.84, 0.24, 1) 0.08s both;
}
@keyframes rise { from { opacity: 0; translate: 0 16px; } to { opacity: 1; translate: 0 0; } }

/* ---------- buttons ---------- */
.links { display: grid; gap: 12px; margin: 104px 0 0; padding: 0; list-style: none; }
.links > li { position: relative; animation: rise 0.6s cubic-bezier(0.16, 0.84, 0.24, 1) both; animation-delay: calc(0.14s + var(--i) * 60ms); }

.btn {
  appearance: none;
  position: relative;
  z-index: 1;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 66px;
  margin: 0;
  padding: 10px 18px 10px 10px;
  border: 0;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.035)), rgba(12, 12, 24, 0.55);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 0 0 1px rgba(255, 255, 255, 0.07), 0 14px 30px -14px rgba(0, 0, 0, 0.8);
  color: var(--ink);
  font: 700 1.125rem/1.2 var(--text);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
}
.btn > * { position: relative; z-index: 1; }
/* spotlight: a bright rim and a soft glow that follow the finger */
.btn::before {
  content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: radial-gradient(150px 110px at var(--mx, -300px) var(--my, -300px), rgba(255, 255, 255, 0.85), transparent 65%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: var(--on, 0); transition: opacity 0.35s ease;
}
.btn::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(190px 130px at var(--mx, -300px) var(--my, -300px), var(--glow, rgba(255, 190, 215, 0.2)), transparent 70%);
  opacity: var(--on, 0); transition: opacity 0.35s ease;
}
.btn:active { transform: scale(0.972); }
.btn:focus-visible { outline: 2px solid var(--iris); outline-offset: 3px; }
/* a single sheen sweeps each button as it settles in */
.sheen {
  position: absolute !important; inset: 0; z-index: 2 !important; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.22) 50%, transparent 65%);
  translate: -120% 0;
  animation: sheen 1.1s ease-out both;
  animation-delay: calc(0.5s + var(--i) * 90ms);
}
@keyframes sheen { to { translate: 120% 0; } }

.tile {
  flex: none; display: grid; place-items: center;
  width: 46px; height: 46px; border-radius: 15px;
  background: var(--tile);
  color: #12101C;
  font: 800 1.15rem/1 var(--display);
  letter-spacing: -0.04em;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.14);
}
.label { flex: none; white-space: nowrap; }
.handle {
  flex: 1 1 auto; min-width: 0; text-align: right;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-weight: 500; font-size: 0.8125rem; color: var(--ink-faint);
}

/* ---------- the bunny ---------- */
.bunny {
  position: absolute; z-index: 0;
  right: 18px; bottom: calc(100% - 1px);
  width: 96px; height: 94px;
  overflow: hidden;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.bunny svg { display: block; width: 96px; height: 94px; overflow: visible; }
.bunny .rig {
  transform-origin: 48px 94px;
  animation: peek 0.9s cubic-bezier(0.2, 1.3, 0.35, 1) 0.55s both, bob 4.2s ease-in-out 1.5s infinite;
}
@keyframes peek { from { translate: 0 80px; } to { translate: 0 0; } }
@keyframes bob { 50% { translate: 0 2px; } }

.bunny .ear { transform-box: fill-box; transform-origin: 50% 100%; }
.bunny .ear.l { animation: sway-l 3.4s ease-in-out infinite alternate; }
.bunny .ear.r { animation: sway-r 4.1s ease-in-out infinite alternate; }
@keyframes sway-l { to { rotate: -5deg; } }
@keyframes sway-r { to { rotate: 4deg; } }
.bunny .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.6s infinite; }
@keyframes blink { 0%, 93%, 100% { scale: 1 1; } 96% { scale: 1 0.1; } }
.bunny .look { translate: var(--lx, 0px) var(--ly, 0px); transition: translate 0.18s ease-out; }
.bunny .happy-eye, .bunny .open-mouth { opacity: 0; }

.bunny.excited .rig { animation: hop 0.5s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
.bunny.excited .ear.l { animation: none; rotate: -9deg; }
.bunny.excited .ear.r { animation: none; rotate: 9deg; }
.bunny.excited .eye { opacity: 0; }
.bunny.excited .happy-eye, .bunny.excited .open-mouth { opacity: 1; }
.bunny.excited .closed-mouth { opacity: 0; }
@keyframes hop { 0% { translate: 0 0; } 45% { translate: 0 -16px; } 100% { translate: 0 -6px; } }

.paws { position: absolute; z-index: 3; right: 18px; bottom: calc(100% - 7px); width: 96px; height: 14px; pointer-events: none; }
.paws svg { display: block; width: 96px; height: 14px; }

.chip {
  position: absolute; z-index: 4; right: 124px; bottom: calc(100% + 30px);
  padding: 7px 12px; border-radius: 14px 14px 4px 14px;
  background: var(--ink); color: #14121F;
  font: 700 0.875rem/1.2 var(--text); white-space: nowrap;
  pointer-events: none;
  opacity: 0; scale: 0.6; transform-origin: 100% 100%;
  transition: opacity 0.15s ease, scale 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.chip.show { opacity: 1; scale: 1; }

.hearts { position: absolute; z-index: 4; right: 18px; bottom: calc(100% + 20px); width: 96px; height: 0; pointer-events: none; }
.heart {
  position: absolute; left: 44px; bottom: 0; width: 18px; height: 18px;
  fill: var(--rose); filter: drop-shadow(0 0 8px rgba(255, 143, 177, 0.7));
  opacity: 0;
  animation: float-up var(--dur, 1.3s) cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}
@keyframes float-up {
  0% { opacity: 0; transform: translate(0, 0) scale(0.4) rotate(0deg); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx, 0px), -90px) scale(var(--s, 1)) rotate(var(--rot, 0deg)); }
}

/* ---------- WhatsApp chat sheet ---------- */
dialog {
  margin: auto auto 0;
  width: min(100%, 520px);
  max-width: 100%;
  padding: 24px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  border: 0;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 26px 26px 0 0;
  background: #0C0D1C;
  color: var(--ink);
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
  translate: 0 0;
  opacity: 1;
  transition: translate 0.45s cubic-bezier(0.16, 0.84, 0.24, 1), opacity 0.3s ease, display 0.45s allow-discrete, overlay 0.45s allow-discrete;
}
dialog:not([open]) { translate: 0 48px; opacity: 0; }
@starting-style { dialog[open] { translate: 0 48px; opacity: 0; } }
dialog::backdrop {
  background: rgba(2, 3, 10, 0.7);
  transition: background-color 0.35s ease, display 0.35s allow-discrete, overlay 0.35s allow-discrete;
}
dialog:not([open])::backdrop { background: transparent; }
@starting-style { dialog[open]::backdrop { background: transparent; } }

.who { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-weight: 700; }
.who .tile { width: 38px; height: 38px; border-radius: 13px; font-size: 1rem; }
.who small { display: block; font-weight: 500; font-size: 0.75rem; color: var(--ink-faint); }
.chat { min-height: 96px; }
.typing {
  display: inline-flex; gap: 5px; padding: 14px 16px;
  border-radius: 18px 18px 18px 6px; background: #1A1E36;
}
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #8E94BC; animation: dot 1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: 0.15s; }
.typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot { 0%, 60%, 100% { translate: 0 0; opacity: 0.5; } 30% { translate: 0 -5px; opacity: 1; } }
.msg {
  display: none; max-width: 94%; margin: 0; padding: 13px 15px;
  border-radius: 18px 18px 18px 6px; background: #1A1E36;
  font: 600 1.0625rem/1.4 var(--text); text-wrap: pretty;
  transform-origin: 0 100%;
}
.sheet.typed .typing { display: none; }
.sheet.typed .msg { display: block; animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes pop { from { opacity: 0; scale: 0.7; } to { opacity: 1; scale: 1; } }
.ok {
  appearance: none; width: 100%; min-height: 54px; margin-top: 18px;
  border: 0; border-radius: 16px; background: var(--ink); color: #0C0D1C;
  font: 700 1.0625rem/1 var(--text); cursor: pointer; transition: transform 0.15s ease;
}
.ok:active { transform: scale(0.98); }
.ok:focus-visible { outline: 2px solid var(--iris); outline-offset: 3px; }

@media (max-height: 700px) {
  .page { padding-block: 16px 18px; }
  .btn { min-height: 58px; }
  .tile { width: 40px; height: 40px; }
  .links { gap: 9px; margin-top: 98px; }
  .tagline { margin-top: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  .bg i, .bg .stars, .name, .tagline, .links > li, .sheen, .bunny .rig, .bunny .ear, .bunny .eye, .typing i { animation: none; }
  .sheen { display: none; }
  .btn, .chip, .bunny .look, dialog, dialog::backdrop, .ok { transition: none; }
  .sheet .msg { animation: none; }
  .heart { animation-duration: 0.01s; }
}
</style>

<div class="bg" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i><i class="stars"></i></div>

<main class="page">
  <h1 class="name">aalsi<br>billi</h1>

        <svg viewBox="0 0 96 94" xmlns="http://www.w3.org/2000/svg">

            <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC4D4"/><stop offset="1" stop-color="#FF8FB1"/></linearGradient>

            <g class="ear r"><ellipse cx="62" cy="25" rx="9" ry="25" fill="url(#fur)" transform="rotate(8 62 46)"/><ellipse cx="61.5" cy="27" rx="4.8" ry="18" fill="url(#inner)" transform="rotate(8 62 46)"/></g>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const bunny = $("bunny"), hearts = $("hearts"), chip = $("chip"), ig = $("ig");
  const dlg = $("wa-dialog"), waBtn = $("wa-btn");
  const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)");
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} };

  /* ---------- buttons: a spotlight that follows the finger ---------- */
  document.querySelectorAll(".btn").forEach((el) => {
    let off = 0;
    const aim = (e) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px");
      el.style.setProperty("--my", (e.clientY - r.top) + "px");
    };
    const on = (e) => { clearTimeout(off); aim(e); el.style.setProperty("--on", "1"); };
    const out = (delay) => { clearTimeout(off); off = setTimeout(() => el.style.setProperty("--on", "0"), delay); };
    el.addEventListener("pointerenter", on);
    el.addEventListener("pointermove", (e) => { aim(e); });
    el.addEventListener("pointerdown", (e) => { on(e); buzz(8); });
    el.addEventListener("pointerup", () => out(260));
    el.addEventListener("pointerleave", () => out(0));
    el.addEventListener("pointercancel", () => out(0));
  });

  /* ---------- bunny ---------- */
  const lines = ["hehe 💖", "follow karo na 🥺", "pls pls 🥺", "yaaay! ✨", "aur dabao 😳"];
  let tapCount = 0, calmTimer = 0, chipTimer = 0;

  function spawnHearts(n) {
    if (reduceMQ.matches) return;
    for (let i = 0; i < n; i++) {
      const h = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      h.setAttribute("viewBox", "0 0 24 24");
      h.setAttribute("class", "heart");
      h.innerHTML = '<path d="M12 21s-7-4.4-9.3-8.6C1 9.2 2.6 5.5 6 5.5c2 0 3.3 1.1 4 2.3.7-1.2 2-2.3 4-2.3 3.4 0 5 3.7 3.3 6.9C19 16.6 12 21 12 21z"/>';
      h.style.setProperty("--dx", ((Math.random() - 0.5) * 90).toFixed(0) + "px");
      h.style.setProperty("--rot", ((Math.random() - 0.5) * 50).toFixed(0) + "deg");
      h.style.setProperty("--s", (0.7 + Math.random() * 0.9).toFixed(2));
      h.style.setProperty("--dur", (1 + Math.random() * 0.7).toFixed(2) + "s");
      h.style.animationDelay = (i * 60) + "ms";
      h.addEventListener("animationend", () => h.remove());
      hearts.appendChild(h);
    }
  }
  function say(text, ms) {
    chip.textContent = text;
    chip.classList.add("show");
    clearTimeout(chipTimer);
    chipTimer = setTimeout(() => chip.classList.remove("show"), ms);
  }
  function cheer(text, count) {
    bunny.classList.remove("excited");
    void bunny.offsetWidth;           // restart the hop
    bunny.classList.add("excited");
    spawnHearts(count);
    say(text, 1300);
    clearTimeout(calmTimer);
    calmTimer = setTimeout(() => bunny.classList.remove("excited"), 1250);
  }
  bunny.addEventListener("pointerdown", () => {
    cheer(lines[tapCount % lines.length], 6);
    tapCount += 1;
    buzz([10, 40, 10]);
  });
  // pressing the Instagram button makes the bunny celebrate straight away
  ig.addEventListener("pointerdown", () => { cheer("yay! 💖", 9); buzz([12, 40, 12]); });
  ig.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") cheer("yay! 💖", 6); });

  // the bunny looks at your finger
  const look = (x, y) => {
    const r = bunny.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height * 0.7);
    const d = Math.max(1, Math.hypot(dx, dy));
    const k = Math.min(1, d / 160) * 2.4;
    bunny.style.setProperty("--lx", (dx / d * k).toFixed(2) + "px");
    bunny.style.setProperty("--ly", (dy / d * k * 0.8).toFixed(2) + "px");
  };
  addEventListener("pointermove", (e) => look(e.clientX, e.clientY), { passive: true });
  addEventListener("pointerdown", (e) => look(e.clientX, e.clientY), { passive: true });

  /* ---------- WhatsApp sheet: typing dots, then the message ---------- */
  let typed = 0;
  waBtn.addEventListener("click", () => {
    clearTimeout(typed);
    dlg.classList.remove("typed");
    if (typeof dlg.showModal === "function") dlg.showModal();
    typed = setTimeout(() => dlg.classList.add("typed"), reduceMQ.matches ? 0 : 750);
  });
  dlg.addEventListener("close", () => clearTimeout(typed));
  if (!("closedBy" in HTMLDialogElement.prototype)) {
    dlg.addEventListener("click", (event) => {
      if (event.target !== dlg) return;
      const r = dlg.getBoundingClientRect();
      const inside = r.top <= event.clientY && event.clientY <= r.top + r.height &&
                     r.left <= event.clientX && event.clientX <= r.left + r.width;
      if (!inside) dlg.close();
    });
  }
})();
</script>
